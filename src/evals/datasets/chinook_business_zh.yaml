dataset:
  name: "Chinook 中文经营问答跨数据源基准 v0.10.1"
  description: "100 条分层数字媒体商店业务问题；v0.10.1 明确存在歧义的输出字段和并列排序，不修改参考业务结果。"
  includes: ["chinook_business_zh_v010.yaml"]
  sql_contract_feature_mode: advisory
  split_ranges:
    development: {start: ch_zh_001, end: ch_zh_060}
    test: {start: ch_zh_061, end: ch_zh_080}
    holdout: {start: ch_zh_081, end: ch_zh_100}

  test_cases:
    - id: "ch_zh_001"
      database_id: "chinook"
      dialect: "postgres"
      query: "各账单国家或地区的销售总额是多少？按销售总额从高到低排列。"
      ground_truth_sql: |
        SELECT billing_country, SUM(total) AS sales_total
        FROM public.invoice
        GROUP BY billing_country
        ORDER BY sales_total DESC, billing_country;
      expected_schema: {tables: ["public.invoice"]}
      result_comparison: {numeric_decimal_places: 2, order_sensitive: false}
      expected_sql_contract:
        required_features: ["aggregation", "group_by", "order_by"]
        required_columns: ["billing_country", "total"]
        max_projection_count: 2
      tags: ["aggregation", "group_by", "ordering"]
      difficulty: "easy"
      metadata: {category: "aggregation", source: "manual", query_language: "zh", business_domain: "sales"}

    - id: "ch_zh_002"
      database_id: "chinook"
      dialect: "postgres"
      query: "统计 2024 年每个月的订单数和销售总额，按月份排列。"
      ground_truth_sql: |
        SELECT DATE_TRUNC('month', invoice_date)::date AS sales_month,
               COUNT(*) AS invoice_count,
               SUM(total) AS sales_total
        FROM public.invoice
        WHERE invoice_date >= DATE '2024-01-01' AND invoice_date < DATE '2025-01-01'
        GROUP BY DATE_TRUNC('month', invoice_date)
        ORDER BY sales_month;
      expected_schema: {tables: ["public.invoice"]}
      result_comparison: {numeric_decimal_places: 2}
      expected_sql_contract:
        required_features: ["aggregation", "group_by", "where", "order_by"]
        required_columns: ["invoice_date", "total"]
        required_filter_columns: ["invoice_date"]
      tags: ["aggregation", "date_filter", "time_series", "group_by"]
      difficulty: "easy"
      metadata: {category: "time_series", source: "manual", query_language: "zh", business_domain: "sales"}

    - id: "ch_zh_003"
      database_id: "chinook"
      dialect: "postgres"
      query: "累计消费金额最高的 10 位客户是谁？返回客户编号、合并后的客户姓名和消费金额；金额并列时按客户编号从小到大排列。"
      ground_truth_sql: |
        SELECT c.customer_id,
               c.first_name || ' ' || c.last_name AS customer_name,
               SUM(i.total) AS sales_total
        FROM public.customer AS c
        JOIN public.invoice AS i ON i.customer_id = c.customer_id
        GROUP BY c.customer_id, c.first_name, c.last_name
        ORDER BY sales_total DESC, c.customer_id
        LIMIT 10;
      expected_schema: {tables: ["public.customer", "public.invoice"]}
      result_comparison: {numeric_decimal_places: 2}
      expected_sql_contract:
        required_features: ["aggregation", "group_by", "join", "order_by", "limit"]
        required_columns: ["customer_id", "first_name", "last_name", "total"]
        max_projection_count: 3
      tags: ["aggregation", "join", "topk", "ordering"]
      difficulty: "easy"
      metadata: {category: "topk", source: "manual", query_language: "zh", business_domain: "customer"}

    - id: "ch_zh_004"
      database_id: "chinook"
      dialect: "postgres"
      query: "销售收入最高的 10 位艺术家是谁？返回艺术家名称和收入。"
      ground_truth_sql: |
        SELECT ar.name AS artist_name,
               SUM(il.unit_price * il.quantity) AS sales_revenue
        FROM public.invoice_line AS il
        JOIN public.track AS t ON t.track_id = il.track_id
        JOIN public.album AS al ON al.album_id = t.album_id
        JOIN public.artist AS ar ON ar.artist_id = al.artist_id
        GROUP BY ar.artist_id, ar.name
        ORDER BY sales_revenue DESC, artist_name
        LIMIT 10;
      expected_schema: {tables: ["public.invoice_line", "public.track", "public.album", "public.artist"]}
      result_comparison: {numeric_decimal_places: 2}
      expected_sql_contract:
        required_features: ["aggregation", "group_by", "join", "order_by", "limit"]
        required_columns: ["unit_price", "quantity", "track_id", "album_id", "artist_id"]
        max_projection_count: 2
      tags: ["aggregation", "multi_table", "join", "topk"]
      difficulty: "medium"
      metadata: {category: "join", source: "manual", query_language: "zh", business_domain: "catalog"}

    - id: "ch_zh_005"
      database_id: "chinook"
      dialect: "postgres"
      query: "各音乐流派的销售收入是多少？按收入从高到低排列；收入并列时按流派名称排列。"
      ground_truth_sql: |
        SELECT g.name AS genre_name,
               SUM(il.unit_price * il.quantity) AS sales_revenue
        FROM public.invoice_line AS il
        JOIN public.track AS t ON t.track_id = il.track_id
        JOIN public.genre AS g ON g.genre_id = t.genre_id
        GROUP BY g.genre_id, g.name
        ORDER BY sales_revenue DESC, genre_name;
      expected_schema: {tables: ["public.invoice_line", "public.track", "public.genre"]}
      result_comparison: {numeric_decimal_places: 2}
      expected_sql_contract:
        required_features: ["aggregation", "group_by", "join", "order_by"]
        required_columns: ["unit_price", "quantity", "track_id", "genre_id"]
        max_projection_count: 2
      tags: ["aggregation", "join", "multi_table", "ordering"]
      difficulty: "medium"
      metadata: {category: "join", source: "manual", query_language: "zh", business_domain: "catalog"}

    - id: "ch_zh_006"
      database_id: "chinook"
      dialect: "postgres"
      query: "销量最高的 10 首曲目是什么？返回曲目名称和销售数量；销量并列时按曲目名称排列。"
      ground_truth_sql: |
        SELECT t.name AS track_name, SUM(il.quantity) AS quantity_sold
        FROM public.invoice_line AS il
        JOIN public.track AS t ON t.track_id = il.track_id
        GROUP BY t.track_id, t.name
        ORDER BY quantity_sold DESC, track_name
        LIMIT 10;
      expected_schema: {tables: ["public.invoice_line", "public.track"]}
      expected_sql_contract:
        required_features: ["aggregation", "group_by", "join", "order_by", "limit"]
        required_columns: ["quantity", "track_id"]
        max_projection_count: 2
      tags: ["aggregation", "join", "topk", "ordering"]
      difficulty: "easy"
      metadata: {category: "topk", source: "manual", query_language: "zh", business_domain: "catalog"}

    - id: "ch_zh_007"
      database_id: "chinook"
      dialect: "postgres"
      query: "每个客户国家或地区有多少名客户？按客户数从高到低排列；客户数并列时按国家或地区名称排列。"
      ground_truth_sql: |
        SELECT country, COUNT(*) AS customer_count
        FROM public.customer
        GROUP BY country
        ORDER BY customer_count DESC, country;
      expected_schema: {tables: ["public.customer"]}
      expected_sql_contract:
        required_features: ["aggregation", "group_by", "order_by"]
        required_columns: ["country"]
        max_projection_count: 2
      tags: ["aggregation", "group_by", "ordering"]
      difficulty: "easy"
      metadata: {category: "aggregation", source: "manual", query_language: "zh", business_domain: "customer"}

    - id: "ch_zh_008"
      database_id: "chinook"
      dialect: "postgres"
      query: "每位客户下了多少笔订单？返回客户编号、合并后的客户姓名和订单数；只保留订单数不少于 7 笔的客户，按订单数从高到低、客户编号从小到大排列。"
      ground_truth_sql: |
        SELECT c.customer_id,
               c.first_name || ' ' || c.last_name AS customer_name,
               COUNT(i.invoice_id) AS invoice_count
        FROM public.customer AS c
        JOIN public.invoice AS i ON i.customer_id = c.customer_id
        GROUP BY c.customer_id, c.first_name, c.last_name
        HAVING COUNT(i.invoice_id) >= 7
        ORDER BY invoice_count DESC, c.customer_id;
      expected_schema: {tables: ["public.customer", "public.invoice"]}
      expected_sql_contract:
        required_features: ["aggregation", "group_by", "join", "having", "order_by"]
        required_columns: ["customer_id", "invoice_id"]
        max_projection_count: 3
      tags: ["aggregation", "join", "having", "ordering"]
      difficulty: "medium"
      metadata: {category: "aggregation", source: "manual", query_language: "zh", business_domain: "customer"}

    - id: "ch_zh_009"
      database_id: "chinook"
      dialect: "postgres"
      query: "每位销售支持员工负责的客户产生了多少销售额？返回员工编号、合并后的员工姓名和销售额；按销售额从高到低、员工编号从小到大排列。"
      ground_truth_sql: |
        SELECT e.employee_id,
               e.first_name || ' ' || e.last_name AS employee_name,
               SUM(i.total) AS sales_total
        FROM public.employee AS e
        JOIN public.customer AS c ON c.support_rep_id = e.employee_id
        JOIN public.invoice AS i ON i.customer_id = c.customer_id
        GROUP BY e.employee_id, e.first_name, e.last_name
        ORDER BY sales_total DESC, e.employee_id;
      expected_schema: {tables: ["public.employee", "public.customer", "public.invoice"]}
      result_comparison: {numeric_decimal_places: 2}
      expected_sql_contract:
        required_features: ["aggregation", "group_by", "join", "order_by"]
        required_columns: ["employee_id", "support_rep_id", "customer_id", "total"]
        max_projection_count: 3
      tags: ["aggregation", "join", "multi_table", "ordering"]
      difficulty: "medium"
      metadata: {category: "join", source: "manual", query_language: "zh", business_domain: "employee"}

    - id: "ch_zh_010"
      database_id: "chinook"
      dialect: "postgres"
      query: "各经理有多少名直接下属？返回经理编号、合并后的经理姓名和直属员工数；按直属员工数从高到低、经理编号从小到大排列。"
      ground_truth_sql: |
        SELECT m.employee_id,
               m.first_name || ' ' || m.last_name AS manager_name,
               COUNT(e.employee_id) AS direct_report_count
        FROM public.employee AS m
        JOIN public.employee AS e ON e.reports_to = m.employee_id
        GROUP BY m.employee_id, m.first_name, m.last_name
        ORDER BY direct_report_count DESC, m.employee_id;
      expected_schema: {tables: ["public.employee"]}
      expected_sql_contract:
        required_features: ["aggregation", "group_by", "join", "order_by"]
        required_columns: ["employee_id", "reports_to"]
        max_projection_count: 3
      tags: ["aggregation", "join", "group_by", "ordering"]
      difficulty: "medium"
      metadata: {category: "join", source: "manual", query_language: "zh", business_domain: "employee"}

    - id: "ch_zh_011"
      database_id: "chinook"
      dialect: "postgres"
      query: "每个播放列表包含多少首不同曲目？返回播放列表编号、名称和不同曲目数；按曲目数从高到低、播放列表编号从小到大排列。"
      ground_truth_sql: |
        SELECT p.playlist_id, p.name AS playlist_name,
               COUNT(DISTINCT pt.track_id) AS track_count
        FROM public.playlist AS p
        LEFT JOIN public.playlist_track AS pt ON pt.playlist_id = p.playlist_id
        GROUP BY p.playlist_id, p.name
        ORDER BY track_count DESC, p.playlist_id;
      expected_schema: {tables: ["public.playlist", "public.playlist_track"]}
      expected_sql_contract:
        required_features: ["aggregation", "group_by", "join", "distinct", "order_by"]
        required_columns: ["playlist_id", "track_id"]
        max_projection_count: 3
      tags: ["aggregation", "join", "distinct", "ordering"]
      difficulty: "easy"
      metadata: {category: "join", source: "manual", query_language: "zh", business_domain: "catalog"}

    - id: "ch_zh_012"
      database_id: "chinook"
      dialect: "postgres"
      query: "曲目数最多的 10 张专辑是什么？返回专辑编号、专辑名称、艺术家和曲目数；曲目数并列时按专辑编号从小到大排列。"
      ground_truth_sql: |
        SELECT al.album_id, al.title AS album_title, ar.name AS artist_name,
               COUNT(t.track_id) AS track_count
        FROM public.album AS al
        JOIN public.artist AS ar ON ar.artist_id = al.artist_id
        LEFT JOIN public.track AS t ON t.album_id = al.album_id
        GROUP BY al.album_id, al.title, ar.name
        ORDER BY track_count DESC, al.album_id
        LIMIT 10;
      expected_schema: {tables: ["public.album", "public.artist", "public.track"]}
      expected_sql_contract:
        required_features: ["aggregation", "group_by", "join", "order_by", "limit"]
        required_columns: ["album_id", "artist_id", "track_id"]
        max_projection_count: 4
      tags: ["aggregation", "join", "topk", "multi_table"]
      difficulty: "medium"
      metadata: {category: "topk", source: "manual", query_language: "zh", business_domain: "catalog"}

    - id: "ch_zh_013"
      database_id: "chinook"
      dialect: "postgres"
      query: "时长最长的 10 首曲目是什么？返回曲目编号、曲目名称和分钟数；时长并列时按曲目编号从小到大排列。"
      ground_truth_sql: |
        SELECT track_id, name AS track_name,
               ROUND(milliseconds / 60000.0, 2) AS duration_minutes
        FROM public.track
        ORDER BY milliseconds DESC, track_id
        LIMIT 10;
      expected_schema: {tables: ["public.track"]}
      result_comparison: {numeric_decimal_places: 2}
      expected_sql_contract:
        required_features: ["order_by", "limit"]
        required_columns: ["track_id", "name", "milliseconds"]
        max_projection_count: 3
      tags: ["aggregation", "topk", "ordering"]
      difficulty: "easy"
      metadata: {category: "topk", source: "manual", query_language: "zh", business_domain: "catalog"}

    - id: "ch_zh_014"
      database_id: "chinook"
      dialect: "postgres"
      query: "各种媒体类型分别有多少首曲目？按曲目数从高到低排列。"
      ground_truth_sql: |
        SELECT mt.name AS media_type_name, COUNT(t.track_id) AS track_count
        FROM public.media_type AS mt
        LEFT JOIN public.track AS t ON t.media_type_id = mt.media_type_id
        GROUP BY mt.media_type_id, mt.name
        ORDER BY track_count DESC, media_type_name;
      expected_schema: {tables: ["public.media_type", "public.track"]}
      expected_sql_contract:
        required_features: ["aggregation", "group_by", "join", "order_by"]
        required_columns: ["media_type_id", "track_id"]
        max_projection_count: 2
      tags: ["aggregation", "join", "group_by", "ordering"]
      difficulty: "easy"
      metadata: {category: "aggregation", source: "manual", query_language: "zh", business_domain: "catalog"}

    - id: "ch_zh_015"
      database_id: "chinook"
      dialect: "postgres"
      query: "各音乐流派的平均曲目时长是多少分钟？按平均时长从高到低排列。"
      ground_truth_sql: |
        SELECT g.name AS genre_name,
               ROUND(AVG(t.milliseconds) / 60000.0, 2) AS avg_duration_minutes
        FROM public.genre AS g
        JOIN public.track AS t ON t.genre_id = g.genre_id
        GROUP BY g.genre_id, g.name
        ORDER BY avg_duration_minutes DESC, genre_name;
      expected_schema: {tables: ["public.genre", "public.track"]}
      result_comparison: {numeric_decimal_places: 2}
      expected_sql_contract:
        required_features: ["aggregation", "group_by", "join", "order_by"]
        required_columns: ["genre_id", "milliseconds"]
        max_projection_count: 2
      tags: ["aggregation", "join", "ordering"]
      difficulty: "easy"
      metadata: {category: "aggregation", source: "manual", query_language: "zh", business_domain: "catalog"}

    - id: "ch_zh_016"
      database_id: "chinook"
      dialect: "postgres"
      query: "哪些客户的累计消费金额高于所有客户的平均累计消费金额？返回客户编号、合并后的客户姓名和累计消费金额；按消费金额从高到低、客户编号从小到大排列。"
      ground_truth_sql: |
        WITH customer_sales AS (
          SELECT c.customer_id,
                 c.first_name || ' ' || c.last_name AS customer_name,
                 SUM(i.total) AS sales_total
          FROM public.customer AS c
          JOIN public.invoice AS i ON i.customer_id = c.customer_id
          GROUP BY c.customer_id, c.first_name, c.last_name
        )
        SELECT customer_id, customer_name, sales_total
        FROM customer_sales
        WHERE sales_total > (SELECT AVG(sales_total) FROM customer_sales)
        ORDER BY sales_total DESC, customer_id;
      expected_schema: {tables: ["public.customer", "public.invoice"]}
      result_comparison: {numeric_decimal_places: 2}
      expected_sql_contract:
        required_features: ["aggregation", "group_by", "join", "order_by"]
        required_feature_groups: [["where", "having"]]
        required_columns: ["customer_id", "total"]
        max_projection_count: 3
      tags: ["aggregation", "cte", "subquery", "ordering"]
      difficulty: "hard"
      metadata: {category: "subquery", source: "manual", query_language: "zh", business_domain: "customer"}

    - id: "ch_zh_017"
      database_id: "chinook"
      dialect: "postgres"
      query: "每个月有多少名不同客户下单？按月份排列。"
      ground_truth_sql: |
        SELECT DATE_TRUNC('month', invoice_date)::date AS sales_month,
               COUNT(DISTINCT customer_id) AS active_customer_count
        FROM public.invoice
        GROUP BY DATE_TRUNC('month', invoice_date)
        ORDER BY sales_month;
      expected_schema: {tables: ["public.invoice"]}
      expected_sql_contract:
        required_features: ["aggregation", "group_by", "distinct", "order_by"]
        required_columns: ["invoice_date", "customer_id"]
        max_projection_count: 2
      tags: ["aggregation", "distinct", "time_series", "ordering"]
      difficulty: "easy"
      metadata: {category: "time_series", source: "manual", query_language: "zh", business_domain: "customer"}

    - id: "ch_zh_018"
      database_id: "chinook"
      dialect: "postgres"
      query: "每张账单包含多少条明细？返回账单编号、账单日期和明细数；只保留明细数大于 5 条的账单，按明细数从高到低、账单编号从小到大排列。"
      ground_truth_sql: |
        SELECT i.invoice_id, i.invoice_date::date AS invoice_date,
               COUNT(il.invoice_line_id) AS line_count
        FROM public.invoice AS i
        JOIN public.invoice_line AS il ON il.invoice_id = i.invoice_id
        GROUP BY i.invoice_id, i.invoice_date
        HAVING COUNT(il.invoice_line_id) > 5
        ORDER BY line_count DESC, i.invoice_id;
      expected_schema: {tables: ["public.invoice", "public.invoice_line"]}
      result_comparison:
        temporal_granularity: "date"
      expected_sql_contract:
        required_features: ["aggregation", "group_by", "join", "having", "order_by"]
        required_columns: ["invoice_id", "invoice_line_id", "invoice_date"]
        max_projection_count: 3
      tags: ["aggregation", "join", "having", "ordering"]
      difficulty: "medium"
      metadata: {category: "aggregation", source: "manual", query_language: "zh", business_domain: "sales"}

    - id: "ch_zh_019"
      database_id: "chinook"
      dialect: "postgres"
      query: "各艺术家发行了多少张专辑？返回艺术家编号、艺术家名称和专辑数；只保留至少有 5 张专辑的艺术家，按专辑数从高到低、艺术家编号从小到大排列。"
      ground_truth_sql: |
        SELECT ar.artist_id, ar.name AS artist_name,
               COUNT(al.album_id) AS album_count
        FROM public.artist AS ar
        JOIN public.album AS al ON al.artist_id = ar.artist_id
        GROUP BY ar.artist_id, ar.name
        HAVING COUNT(al.album_id) >= 5
        ORDER BY album_count DESC, ar.artist_id;
      expected_schema: {tables: ["public.artist", "public.album"]}
      expected_sql_contract:
        required_features: ["aggregation", "group_by", "join", "having", "order_by"]
        required_columns: ["artist_id", "album_id"]
        max_projection_count: 3
      tags: ["aggregation", "join", "having", "ordering"]
      difficulty: "medium"
      metadata: {category: "aggregation", source: "manual", query_language: "zh", business_domain: "catalog"}

    - id: "ch_zh_020"
      database_id: "chinook"
      dialect: "postgres"
      query: "创作曲目数最多的 10 位作曲者是谁？忽略未填写作曲者的曲目。"
      ground_truth_sql: |
        SELECT composer, COUNT(*) AS track_count
        FROM public.track
        WHERE composer IS NOT NULL AND composer <> ''
        GROUP BY composer
        ORDER BY track_count DESC, composer
        LIMIT 10;
      expected_schema: {tables: ["public.track"]}
      expected_sql_contract:
        required_features: ["aggregation", "group_by", "where", "order_by", "limit"]
        required_columns: ["composer"]
        required_filter_columns: ["composer"]
        max_projection_count: 2
      result_comparison: {order_sensitive: false}
      tags: ["aggregation", "null_handling", "topk", "ordering"]
      difficulty: "easy"
      metadata: {category: "topk", source: "manual", query_language: "zh", business_domain: "catalog"}

    - id: "ch_zh_021"
      database_id: "chinook"
      dialect: "postgres"
      query: "各账单国家或地区的平均客单价是多少？按平均客单价从高到低排列；平均客单价并列时按国家或地区名称排列。"
      ground_truth_sql: |
        SELECT billing_country, AVG(total) AS average_invoice_value
        FROM public.invoice
        GROUP BY billing_country
        ORDER BY average_invoice_value DESC, billing_country;
      expected_schema: {tables: ["public.invoice"]}
      result_comparison: {numeric_decimal_places: 2}
      expected_sql_contract:
        required_features: ["aggregation", "group_by", "order_by"]
        required_columns: ["billing_country", "total"]
        max_projection_count: 2
      tags: ["aggregation", "group_by", "ordering"]
      difficulty: "easy"
      metadata: {category: "aggregation", source: "manual", query_language: "zh", business_domain: "sales"}

    - id: "ch_zh_022"
      database_id: "chinook"
      dialect: "postgres"
      query: "按年份统计销售总额、订单数和平均客单价，按年份排列。"
      ground_truth_sql: |
        SELECT EXTRACT(YEAR FROM invoice_date)::int AS sales_year,
               SUM(total) AS sales_total,
               COUNT(*) AS invoice_count,
               AVG(total) AS average_invoice_value
        FROM public.invoice
        GROUP BY EXTRACT(YEAR FROM invoice_date)
        ORDER BY sales_year;
      expected_schema: {tables: ["public.invoice"]}
      result_comparison: {numeric_decimal_places: 2}
      expected_sql_contract:
        required_features: ["aggregation", "group_by", "order_by"]
        required_columns: ["invoice_date", "total"]
        max_projection_count: 4
      tags: ["aggregation", "time_series", "group_by", "ordering"]
      difficulty: "easy"
      metadata: {category: "time_series", source: "manual", query_language: "zh", business_domain: "sales"}

    - id: "ch_zh_023"
      database_id: "chinook"
      dialect: "postgres"
      query: "各音乐流派中销售收入最高的曲目是什么？返回流派、曲目和收入；收入并列时选择 track_id 最小的曲目。"
      ground_truth_sql: |
        WITH track_sales AS (
          SELECT g.genre_id, g.name AS genre_name, t.track_id,
                 t.name AS track_name,
                 SUM(il.unit_price * il.quantity) AS sales_revenue
          FROM public.genre AS g
          JOIN public.track AS t ON t.genre_id = g.genre_id
          JOIN public.invoice_line AS il ON il.track_id = t.track_id
          GROUP BY g.genre_id, g.name, t.track_id, t.name
        ), ranked AS (
          SELECT *, ROW_NUMBER() OVER (
            PARTITION BY genre_id ORDER BY sales_revenue DESC, track_id
          ) AS revenue_rank
          FROM track_sales
        )
        SELECT genre_name, track_name, sales_revenue
        FROM ranked
        WHERE revenue_rank = 1
        ORDER BY genre_name;
      expected_schema: {tables: ["public.genre", "public.track", "public.invoice_line"]}
      result_comparison: {numeric_decimal_places: 2, order_sensitive: false}
      expected_sql_contract:
        required_features: ["aggregation", "group_by", "join", "order_by"]
        required_columns: ["genre_id", "track_id", "unit_price", "quantity"]
        max_projection_count: 3
      tags: ["aggregation", "window", "multi_table", "ranking"]
      difficulty: "hard"
      metadata: {category: "window", source: "manual", query_language: "zh", business_domain: "catalog"}

    - id: "ch_zh_024"
      database_id: "chinook"
      dialect: "postgres"
      query: "每位客户最近一次下单日期和距离上一次下单的天数是多少？返回客户编号、合并后的客户姓名、最近下单日期和间隔天数；只保留至少有两笔订单的客户，按客户编号从小到大排列。"
      ground_truth_sql: |
        WITH ordered_invoices AS (
          SELECT customer_id, invoice_date,
                 LAG(invoice_date) OVER (
                   PARTITION BY customer_id ORDER BY invoice_date, invoice_id
                 ) AS previous_invoice_date,
                 ROW_NUMBER() OVER (
                   PARTITION BY customer_id ORDER BY invoice_date DESC, invoice_id DESC
                 ) AS latest_rank,
                 COUNT(*) OVER (PARTITION BY customer_id) AS invoice_count
          FROM public.invoice
        )
        SELECT c.customer_id,
               c.first_name || ' ' || c.last_name AS customer_name,
               oi.invoice_date::date AS latest_invoice_date,
               (oi.invoice_date::date - oi.previous_invoice_date::date) AS days_since_previous
        FROM ordered_invoices AS oi
        JOIN public.customer AS c ON c.customer_id = oi.customer_id
        WHERE oi.latest_rank = 1 AND oi.invoice_count >= 2
        ORDER BY c.customer_id;
      expected_schema: {tables: ["public.invoice", "public.customer"]}
      expected_sql_contract:
        required_features: ["join", "where", "order_by"]
        required_columns: ["customer_id", "invoice_date", "invoice_id"]
        max_projection_count: 4
      tags: ["window", "time_series", "join", "ordering"]
      difficulty: "hard"
      metadata: {category: "window", source: "manual", query_language: "zh", business_domain: "customer"}

    - id: "ch_zh_025"
      database_id: "chinook"
      dialect: "postgres"
      query: "比较 2023 年和 2024 年各月份的销售总额，并计算 2024 年相对 2023 年的销售额变化；返回月份、两年销售额和变化额，按月份排列。"
      ground_truth_sql: |
        SELECT EXTRACT(MONTH FROM invoice_date)::int AS sales_month,
               SUM(CASE WHEN EXTRACT(YEAR FROM invoice_date) = 2023 THEN total ELSE 0 END) AS sales_2023,
               SUM(CASE WHEN EXTRACT(YEAR FROM invoice_date) = 2024 THEN total ELSE 0 END) AS sales_2024,
               SUM(CASE WHEN EXTRACT(YEAR FROM invoice_date) = 2024 THEN total ELSE 0 END)
                 - SUM(CASE WHEN EXTRACT(YEAR FROM invoice_date) = 2023 THEN total ELSE 0 END) AS sales_change
        FROM public.invoice
        WHERE invoice_date >= DATE '2023-01-01' AND invoice_date < DATE '2025-01-01'
        GROUP BY EXTRACT(MONTH FROM invoice_date)
        ORDER BY sales_month;
      expected_schema: {tables: ["public.invoice"]}
      result_comparison: {numeric_decimal_places: 2}
      expected_sql_contract:
        required_features: ["aggregation", "case_when", "group_by", "where", "order_by"]
        required_columns: ["invoice_date", "total"]
        required_filter_columns: ["invoice_date"]
        max_projection_count: 4
      tags: ["aggregation", "comparison", "time_series", "date_filter", "case_when", "group_by"]
      difficulty: "hard"
      metadata: {category: "comparison", source: "manual", query_language: "zh", business_domain: "sales"}

    - id: "ch_zh_026"
