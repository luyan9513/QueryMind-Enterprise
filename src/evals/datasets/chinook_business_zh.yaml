    - id: "ch_zh_029"
      database_id: "chinook"
      dialect: "postgres"
      query: "按客户累计消费金额分层：不少于 45 为高价值、40（含）到 45（不含）为中价值、低于 40 为低价值。统计各层客户数和销售总额，按高价值、中价值、低价值顺序排列。"
      ground_truth_sql: |
        WITH customer_sales AS (
          SELECT c.customer_id, SUM(i.total) AS sales_total
          FROM public.customer AS c
          JOIN public.invoice AS i ON i.customer_id = c.customer_id
          GROUP BY c.customer_id
        ), customer_tiers AS (
          SELECT customer_id, sales_total,
                 CASE
                   WHEN sales_total >= 45 THEN '高价值'
                   WHEN sales_total >= 40 THEN '中价值'
                   ELSE '低价值'
                 END AS customer_tier
          FROM customer_sales
        )
        SELECT customer_tier, COUNT(*) AS customer_count,
               SUM(sales_total) AS tier_sales_total
        FROM customer_tiers
        GROUP BY customer_tier
        ORDER BY CASE customer_tier
                   WHEN '高价值' THEN 1
                   WHEN '中价值' THEN 2
                   ELSE 3
                 END;
      expected_schema: {tables: ["public.customer", "public.invoice"]}
      result_comparison: {numeric_decimal_places: 2}
      expected_sql_contract:
        required_features: ["aggregation", "case_when", "cte", "join", "group_by", "order_by"]
        required_columns: ["customer_id", "total"]
        max_projection_count: 3
      tags: ["aggregation", "case_when", "cte", "join", "multi_table", "group_by", "ordering"]
      difficulty: "hard"
      metadata: {category: "case_when", source: "manual", query_language: "zh", business_domain: "customer"}

