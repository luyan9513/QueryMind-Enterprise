    - id: "ch_zh_039"
      database_id: "chinook"
      dialect: "postgres"
      query: "计算 2024 年每个月的销售总额、上个月销售总额和环比变化额；第一个月的上月金额和变化额保留为空，按月份排列。"
      ground_truth_sql: |
        WITH monthly_sales AS (
          SELECT DATE_TRUNC('month', invoice_date)::date AS sales_month,
                 SUM(total) AS sales_total
          FROM public.invoice
          WHERE invoice_date >= DATE '2024-01-01'
            AND invoice_date < DATE '2025-01-01'
          GROUP BY DATE_TRUNC('month', invoice_date)
        ), with_previous AS (
          SELECT sales_month, sales_total,
                 LAG(sales_total) OVER (ORDER BY sales_month) AS previous_month_sales
          FROM monthly_sales
        )
        SELECT sales_month, sales_total, previous_month_sales,
               sales_total - previous_month_sales AS sales_change
        FROM with_previous
        ORDER BY sales_month;
      expected_schema: {tables: ["public.invoice"]}
      result_comparison: {numeric_decimal_places: 2}
      expected_sql_contract:
        required_features: ["aggregation", "cte", "window", "where", "group_by", "order_by"]
        required_columns: ["invoice_date", "total"]
        required_filter_columns: ["invoice_date"]
        max_projection_count: 4
      tags: ["aggregation", "time_series", "date_filter", "window", "cte", "null_handling", "ordering"]
      difficulty: "hard"
      metadata: {category: "time_series", source: "manual", query_language: "zh", business_domain: "sales"}

    - id: "ch_zh_040"
      database_id: "chinook"
      dialect: "postgres"
      query: "按客户首次下单年份统计新增客户数；返回首次下单年份和新增客户数，按年份排列。"
      ground_truth_sql: |
        WITH first_orders AS (
          SELECT customer_id, MIN(invoice_date) AS first_invoice_date
          FROM public.invoice
          GROUP BY customer_id
        )
        SELECT EXTRACT(YEAR FROM first_invoice_date)::int AS first_order_year,
               COUNT(*) AS new_customer_count
        FROM first_orders
        GROUP BY EXTRACT(YEAR FROM first_invoice_date)
        ORDER BY first_order_year;
      expected_schema: {tables: ["public.invoice"]}
      expected_sql_contract:
        required_features: ["aggregation", "cte", "group_by", "order_by"]
        required_columns: ["customer_id", "invoice_date"]
        max_projection_count: 2
      tags: ["aggregation", "time_series", "cte", "group_by", "ordering"]
      difficulty: "medium"
      metadata: {category: "time_series", source: "manual", query_language: "zh", business_domain: "customer"}

    - id: "ch_zh_041"
      database_id: "chinook"
      dialect: "postgres"
      query: "统计 2022 到 2024 年每位销售支持员工每年的订单数和销售总额；返回年份、员工编号、员工姓名、订单数和销售总额，按年份、员工编号排列。"
      ground_truth_sql: |
        SELECT EXTRACT(YEAR FROM i.invoice_date)::int AS sales_year,
               e.employee_id,
               e.first_name || ' ' || e.last_name AS employee_name,
               COUNT(DISTINCT i.invoice_id) AS invoice_count,
               SUM(i.total) AS sales_total
        FROM public.employee AS e
        JOIN public.customer AS c ON c.support_rep_id = e.employee_id
        JOIN public.invoice AS i ON i.customer_id = c.customer_id
        WHERE i.invoice_date >= DATE '2022-01-01'
          AND i.invoice_date < DATE '2025-01-01'
        GROUP BY EXTRACT(YEAR FROM i.invoice_date),
                 e.employee_id, e.first_name, e.last_name
        ORDER BY sales_year, e.employee_id;
      expected_schema: {tables: ["public.employee", "public.customer", "public.invoice"]}
      result_comparison: {numeric_decimal_places: 2}
      expected_sql_contract:
        required_features: ["aggregation", "distinct", "join", "where", "group_by", "order_by"]
        required_columns: ["employee_id", "support_rep_id", "customer_id", "invoice_id", "invoice_date", "total"]
        required_filter_columns: ["invoice_date"]
        max_projection_count: 5
      tags: ["aggregation", "time_series", "date_filter", "distinct", "join", "multi_table", "group_by", "ordering"]
      difficulty: "medium"
      metadata: {category: "time_series", source: "manual", query_language: "zh", business_domain: "employee"}

    - id: "ch_zh_042"
      database_id: "chinook"
      dialect: "postgres"
      query: "列出每位客户及其销售支持员工，并统计客户的订单数和累计消费金额；返回客户编号、客户姓名、员工编号、员工姓名、订单数和消费金额，按客户编号排列。"
      ground_truth_sql: |
        SELECT c.customer_id,
               c.first_name || ' ' || c.last_name AS customer_name,
               e.employee_id,
               e.first_name || ' ' || e.last_name AS employee_name,
               COUNT(i.invoice_id) AS invoice_count,
               COALESCE(SUM(i.total), 0) AS sales_total
        FROM public.customer AS c
        JOIN public.employee AS e ON e.employee_id = c.support_rep_id
        LEFT JOIN public.invoice AS i ON i.customer_id = c.customer_id
        GROUP BY c.customer_id, c.first_name, c.last_name,
                 e.employee_id, e.first_name, e.last_name
        ORDER BY c.customer_id;
      expected_schema: {tables: ["public.customer", "public.employee", "public.invoice"]}
      result_comparison: {numeric_decimal_places: 2}
      expected_sql_contract:
        required_features: ["aggregation", "join", "group_by", "order_by"]
        required_columns: ["customer_id", "support_rep_id", "employee_id", "invoice_id", "total"]
        max_projection_count: 6
      tags: ["aggregation", "join", "multi_table", "null_handling", "group_by", "ordering"]
      difficulty: "medium"
      metadata: {category: "join", source: "manual", query_language: "zh", business_domain: "employee"}

    - id: "ch_zh_043"
      database_id: "chinook"
      dialect: "postgres"
      query: "按客户所在国家或地区统计客户数、订单数和销售总额；返回国家或地区、不同客户数、不同订单数和销售总额，按销售总额从高到低排列。"
      ground_truth_sql: |
        SELECT c.country,
               COUNT(DISTINCT c.customer_id) AS customer_count,
               COUNT(DISTINCT i.invoice_id) AS invoice_count,
               SUM(i.total) AS sales_total
        FROM public.customer AS c
        JOIN public.invoice AS i ON i.customer_id = c.customer_id
        GROUP BY c.country
        ORDER BY sales_total DESC, c.country;
      expected_schema: {tables: ["public.customer", "public.invoice"]}
      result_comparison: {numeric_decimal_places: 2}
      expected_sql_contract:
        required_features: ["aggregation", "distinct", "join", "group_by", "order_by"]
        required_columns: ["country", "customer_id", "invoice_id", "total"]
        max_projection_count: 4
      tags: ["aggregation", "distinct", "join", "multi_table", "group_by", "ordering"]
      difficulty: "medium"
      metadata: {category: "join", source: "manual", query_language: "zh", business_domain: "sales"}

    - id: "ch_zh_044"
      database_id: "chinook"
      dialect: "postgres"
      query: "统计每种媒体类型的目录曲目数、有销售记录的不同曲目数和销售收入；没有销售时收入显示 0，按媒体类型编号排列。"
      ground_truth_sql: |
        SELECT mt.media_type_id, mt.name AS media_type_name,
               COUNT(DISTINCT t.track_id) AS catalog_track_count,
               COUNT(DISTINCT il.track_id) AS sold_track_count,
               COALESCE(SUM(il.unit_price * il.quantity), 0) AS sales_revenue
        FROM public.media_type AS mt
        LEFT JOIN public.track AS t ON t.media_type_id = mt.media_type_id
        LEFT JOIN public.invoice_line AS il ON il.track_id = t.track_id
        GROUP BY mt.media_type_id, mt.name
        ORDER BY mt.media_type_id;
      expected_schema: {tables: ["public.media_type", "public.track", "public.invoice_line"]}
      result_comparison: {numeric_decimal_places: 2}
      expected_sql_contract:
        required_features: ["aggregation", "distinct", "join", "group_by", "order_by"]
        required_columns: ["media_type_id", "track_id", "unit_price", "quantity"]
        max_projection_count: 5
      tags: ["aggregation", "distinct", "join", "multi_table", "null_handling", "group_by", "ordering"]
      difficulty: "medium"
      metadata: {category: "join", source: "manual", query_language: "zh", business_domain: "catalog"}

    - id: "ch_zh_045"
      database_id: "chinook"
      dialect: "postgres"
      query: "哪些客户国家或地区至少有 3 名客户？返回国家或地区和客户数，按客户数从高到低、国家或地区名称排列。"
      ground_truth_sql: |
        SELECT country, COUNT(*) AS customer_count
        FROM public.customer
        GROUP BY country
        HAVING COUNT(*) >= 3
        ORDER BY customer_count DESC, country;
      expected_schema: {tables: ["public.customer"]}
      expected_sql_contract:
        required_features: ["aggregation", "group_by", "having", "order_by"]
        required_columns: ["country"]
        max_projection_count: 2
      tags: ["aggregation", "having", "group_by", "ordering"]
      difficulty: "easy"
      metadata: {category: "aggregation", source: "manual", query_language: "zh", business_domain: "customer"}

    - id: "ch_zh_046"
      database_id: "chinook"
      dialect: "postgres"
      query: "哪些账单城市至少有 10 笔订单？返回城市、订单数、销售总额和平均客单价，按销售总额从高到低、城市名称排列。"
      ground_truth_sql: |
        SELECT billing_city,
               COUNT(*) AS invoice_count,
               SUM(total) AS sales_total,
               AVG(total) AS average_invoice_value
        FROM public.invoice
        GROUP BY billing_city
        HAVING COUNT(*) >= 10
        ORDER BY sales_total DESC, billing_city;
      expected_schema: {tables: ["public.invoice"]}
      result_comparison: {numeric_decimal_places: 2}
      expected_sql_contract:
        required_features: ["aggregation", "group_by", "having", "order_by"]
        required_columns: ["billing_city", "total"]
        max_projection_count: 4
      tags: ["aggregation", "having", "group_by", "ordering"]
      difficulty: "easy"
      metadata: {category: "aggregation", source: "manual", query_language: "zh", business_domain: "sales"}

    - id: "ch_zh_047"
      database_id: "chinook"
      dialect: "postgres"
      query: "2024 年销售总额最高的 5 个账单城市是哪些？返回城市、订单数和销售总额；金额并列时按城市名称排列。"
      ground_truth_sql: |
        SELECT billing_city,
               COUNT(*) AS invoice_count,
               SUM(total) AS sales_total
        FROM public.invoice
        WHERE invoice_date >= DATE '2024-01-01'
          AND invoice_date < DATE '2025-01-01'
        GROUP BY billing_city
        ORDER BY sales_total DESC, billing_city
        LIMIT 5;
      expected_schema: {tables: ["public.invoice"]}
      result_comparison: {numeric_decimal_places: 2}
      expected_sql_contract:
