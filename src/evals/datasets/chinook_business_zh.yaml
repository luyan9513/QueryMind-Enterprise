    - id: "ch_zh_049"
      database_id: "chinook"
      dialect: "postgres"
      query: "哪些曲目的单价高于其所属媒体类型的平均曲目单价？返回曲目编号、曲目名称、媒体类型、曲目单价和该媒体类型平均单价，按媒体类型、曲目单价从高到低、曲目编号排列。"
      ground_truth_sql: |
        SELECT t.track_id, t.name AS track_name,
               mt.name AS media_type_name, t.unit_price,
               averages.media_type_average_price
        FROM public.track AS t
        JOIN public.media_type AS mt ON mt.media_type_id = t.media_type_id
        JOIN (
          SELECT media_type_id, AVG(unit_price) AS media_type_average_price
          FROM public.track
          GROUP BY media_type_id
        ) AS averages ON averages.media_type_id = t.media_type_id
        WHERE t.unit_price > averages.media_type_average_price
        ORDER BY mt.name, t.unit_price DESC, t.track_id;
      expected_schema: {tables: ["public.track", "public.media_type"]}
      result_comparison: {numeric_decimal_places: 2}
      expected_sql_contract:
        required_features: ["aggregation", "subquery", "join", "where", "order_by"]
        required_columns: ["track_id", "media_type_id", "unit_price"]
        required_filter_columns: ["unit_price"]
        max_projection_count: 5
      tags: ["aggregation", "subquery", "comparison", "join", "multi_table", "ordering"]
      difficulty: "medium"
      metadata: {category: "subquery", source: "manual", query_language: "zh", business_domain: "catalog"}

    - id: "ch_zh_050"
      database_id: "chinook"
      dialect: "postgres"
      query: "找出每个客户国家或地区累计消费金额最高的 2 位客户；返回国家或地区、客户编号、合并后的客户姓名、消费金额和国家内排名，金额并列时按客户编号从小到大排列。"
      ground_truth_sql: |
        WITH customer_sales AS (
          SELECT c.country, c.customer_id,
                 c.first_name || ' ' || c.last_name AS customer_name,
                 SUM(i.total) AS sales_total
          FROM public.customer AS c
          JOIN public.invoice AS i ON i.customer_id = c.customer_id
          GROUP BY c.country, c.customer_id, c.first_name, c.last_name
        ), ranked AS (
          SELECT *, ROW_NUMBER() OVER (
            PARTITION BY country ORDER BY sales_total DESC, customer_id
          ) AS country_rank
          FROM customer_sales
        )
        SELECT country, customer_id, customer_name, sales_total, country_rank
        FROM ranked
        WHERE country_rank <= 2
        ORDER BY country, country_rank, customer_id;
      expected_schema: {tables: ["public.customer", "public.invoice"]}
      result_comparison: {numeric_decimal_places: 2}
      expected_sql_contract:
        required_features: ["aggregation", "cte", "window", "join", "where", "group_by", "order_by"]
        required_columns: ["country", "customer_id", "total"]
        max_projection_count: 5
      tags: ["aggregation", "window", "ranking", "topk", "cte", "join", "multi_table", "ordering"]
      difficulty: "hard"
      metadata: {category: "window", source: "manual", query_language: "zh", business_domain: "customer"}
