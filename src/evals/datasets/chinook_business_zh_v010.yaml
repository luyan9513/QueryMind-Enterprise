      ground_truth_sql: "WITH customer_sales AS (SELECT c.country, c.customer_id, c.first_name || ' ' || c.last_name AS customer_name, SUM(i.total) AS sales_total FROM public.customer c JOIN public.invoice i ON i.customer_id = c.customer_id GROUP BY c.country, c.customer_id, c.first_name, c.last_name), country_avg AS (SELECT country, AVG(sales_total) AS average_sales FROM customer_sales GROUP BY country) SELECT cs.country, cs.customer_id, cs.customer_name, cs.sales_total, ca.average_sales FROM customer_sales cs JOIN country_avg ca ON ca.country = cs.country WHERE cs.sales_total > ca.average_sales ORDER BY cs.country, cs.sales_total DESC, cs.customer_id;"
