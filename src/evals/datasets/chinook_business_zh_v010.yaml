      dialect: postgres
      query: "统计 2022 到 2024 年每位销售支持员工每年的不同客户数和销售总额；返回年份、员工编号、合并后的员工姓名、不同客户数和销售总额。"
      ground_truth_sql: "SELECT EXTRACT(YEAR FROM i.invoice_date)::int AS sales_year, e.employee_id, e.first_name || ' ' || e.last_name AS employee_name, COUNT(DISTINCT c.customer_id) AS customer_count, SUM(i.total) AS sales_total FROM public.employee e JOIN public.customer c ON c.support_rep_id = e.employee_id JOIN public.invoice i ON i.customer_id = c.customer_id WHERE i.invoice_date >= DATE '2022-01-01' AND i.invoice_date < DATE '2025-01-01' GROUP BY EXTRACT(YEAR FROM i.invoice_date), e.employee_id, e.first_name, e.last_name ORDER BY sales_year, e.employee_id;"
      expected_schema: {tables: ["public.employee", "public.customer", "public.invoice"]}
      expected_sql_contract: {required_features: [aggregation, distinct, join, where, group_by, order_by], max_projection_count: 5}
      tags: [aggregation, time_series, date_filter, distinct, join, multi_table, group_by, ordering]
      difficulty: medium
      metadata: {category: time_series, source: manual, query_language: zh, business_domain: employee}
      result_comparison: {order_sensitive: false}

    - id: ch_zh_099
      database_id: chinook
      dialect: postgres
      query: "按负责客户数把销售支持员工分为小于 20、20 到 21、22 及以上三档；返回员工编号、合并后的员工姓名、负责客户数和档位。"
      ground_truth_sql: "SELECT e.employee_id, e.first_name || ' ' || e.last_name AS employee_name, COUNT(c.customer_id) AS customer_count, CASE WHEN COUNT(c.customer_id) < 20 THEN 'small' WHEN COUNT(c.customer_id) < 22 THEN 'medium' ELSE 'large' END AS portfolio_tier FROM public.employee e JOIN public.customer c ON c.support_rep_id = e.employee_id GROUP BY e.employee_id, e.first_name, e.last_name HAVING COUNT(c.customer_id) > 0 ORDER BY customer_count DESC, e.employee_id;"
      expected_schema: {tables: ["public.employee", "public.customer"]}
      expected_sql_contract: {required_features: [aggregation, case_when, join, group_by, having, order_by], max_projection_count: 4}
      tags: [aggregation, case_when, join, multi_table, having, group_by, ordering]
      difficulty: medium
      metadata: {category: join, source: manual, query_language: zh, business_domain: employee}
      result_comparison: {order_sensitive: false}

    - id: ch_zh_100
      database_id: chinook
      dialect: postgres
      query: "汇总员工办公城市与客户所在城市的去重列表，并标记来源。只返回城市和来源，不返回计数。"
      ground_truth_sql: "SELECT city, source FROM (SELECT city, 'employee' AS source FROM public.employee UNION SELECT city, 'customer' AS source FROM public.customer) locations ORDER BY city, source;"
