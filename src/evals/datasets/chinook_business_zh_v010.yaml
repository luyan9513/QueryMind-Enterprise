dataset:
  name: "Chinook v0.10.1 分层补充集"
  description: "生产候选基准的第 51-100 题；v0.10.1 明确输出字段并消除非业务排序歧义。"
  test_cases:
    - id: ch_zh_051
      database_id: chinook
      dialect: postgres
      query: "每种媒体类型包含多少首目录曲目？返回媒体类型编号、媒体类型名称和曲目数，按曲目数从高到低排列。"
      ground_truth_sql: "SELECT mt.media_type_id, mt.name AS media_type_name, COUNT(t.track_id) AS track_count FROM public.media_type mt LEFT JOIN public.track t ON t.media_type_id = mt.media_type_id GROUP BY mt.media_type_id, mt.name ORDER BY track_count DESC, mt.media_type_id;"
      expected_schema: {tables: ["public.media_type", "public.track"]}
      expected_sql_contract: {required_features: [aggregation, join, group_by, order_by]}
      tags: [aggregation, join, multi_table, null_handling, group_by, ordering]
      difficulty: easy
      metadata: {category: aggregation, source: manual, query_language: zh, business_domain: catalog}

    - id: ch_zh_052
      database_id: chinook
      dialect: postgres
      query: "列出时长超过 5 分钟的曲目，返回曲目编号、名称和毫秒时长，按时长从高到低排列。"
      ground_truth_sql: "SELECT track_id, name AS track_name, milliseconds FROM public.track WHERE milliseconds > 300000 ORDER BY milliseconds DESC, track_id;"
      expected_schema: {tables: ["public.track"]}
      expected_sql_contract: {required_features: [where, order_by]}
      tags: [filtering, ordering]
      difficulty: easy
      metadata: {category: filtering, source: manual, query_language: zh, business_domain: catalog}
      result_comparison: {order_sensitive: false}

    - id: ch_zh_053
      database_id: chinook
      dialect: postgres
      query: "每位艺术家发行了多少张专辑？返回艺术家编号、名称和专辑数，按专辑数从高到低排列。"
      ground_truth_sql: "SELECT ar.artist_id, ar.name AS artist_name, COUNT(al.album_id) AS album_count FROM public.artist ar LEFT JOIN public.album al ON al.artist_id = ar.artist_id GROUP BY ar.artist_id, ar.name ORDER BY album_count DESC, ar.artist_id;"
      expected_schema: {tables: ["public.artist", "public.album"]}
      expected_sql_contract: {required_features: [aggregation, join, group_by, order_by]}
      tags: [aggregation, join, multi_table, null_handling, group_by, ordering]
      difficulty: medium
      metadata: {category: join, source: manual, query_language: zh, business_domain: catalog}

    - id: ch_zh_054
      database_id: chinook
      dialect: postgres
      query: "作品数至少为 5 的作曲者中，作品数量最多的 10 位是谁？忽略作曲者为空的曲目。"
      ground_truth_sql: "SELECT composer, COUNT(*) AS track_count FROM public.track WHERE composer IS NOT NULL GROUP BY composer HAVING COUNT(*) >= 5 ORDER BY track_count DESC, composer LIMIT 10;"
      expected_schema: {tables: ["public.track"]}
      expected_sql_contract: {required_features: [aggregation, where, group_by, having, order_by, limit]}
      tags: [aggregation, filtering, topk, null_handling, having, group_by, ordering]
      difficulty: medium
      metadata: {category: topk, source: manual, query_language: zh, business_domain: catalog}
      result_comparison: {order_sensitive: false}

    - id: ch_zh_055
      database_id: chinook
      dialect: postgres
      query: "每个流派中单价最高的 3 首曲目是什么？返回流派、曲目编号、名称、单价和流派内排名。"
      ground_truth_sql: "WITH ranked AS (SELECT g.name AS genre_name, t.track_id, t.name AS track_name, t.unit_price, ROW_NUMBER() OVER (PARTITION BY g.genre_id ORDER BY t.unit_price DESC, t.track_id) AS genre_rank FROM public.genre g JOIN public.track t ON t.genre_id = g.genre_id) SELECT genre_name, track_id, track_name, unit_price, genre_rank FROM ranked WHERE genre_rank <= 3 ORDER BY genre_name, genre_rank, track_id;"
      expected_schema: {tables: ["public.genre", "public.track"]}
      expected_sql_contract: {required_features: [window, join, where, order_by]}
      tags: [window, ranking, topk, cte, join, multi_table, ordering]
      difficulty: hard
      metadata: {category: window, source: manual, query_language: zh, business_domain: catalog}

    - id: ch_zh_056
      database_id: chinook
      dialect: postgres
      query: "哪些艺术家的专辑数高于所有艺术家的平均专辑数？返回艺术家编号、名称和专辑数。"
      ground_truth_sql: "WITH counts AS (SELECT ar.artist_id, ar.name AS artist_name, COUNT(al.album_id) AS album_count FROM public.artist ar LEFT JOIN public.album al ON al.artist_id = ar.artist_id GROUP BY ar.artist_id, ar.name) SELECT artist_id, artist_name, album_count FROM counts WHERE album_count > (SELECT AVG(album_count) FROM counts) ORDER BY album_count DESC, artist_id;"
      expected_schema: {tables: ["public.artist", "public.album"]}
      expected_sql_contract: {required_features: [aggregation, cte, subquery, join, where, group_by, order_by]}
      tags: [aggregation, cte, subquery, comparison, join, multi_table, group_by, ordering]
      difficulty: hard
      metadata: {category: subquery, source: manual, query_language: zh, business_domain: catalog}
      result_comparison: {order_sensitive: false}

    - id: ch_zh_057
      database_id: chinook
      dialect: postgres
      query: "哪些流派的平均曲目时长高于全部曲目的平均时长？返回流派编号、流派名称和平均毫秒时长。"
      ground_truth_sql: "SELECT g.genre_id, g.name AS genre_name, AVG(t.milliseconds) AS average_milliseconds FROM public.genre g JOIN public.track t ON t.genre_id = g.genre_id GROUP BY g.genre_id, g.name HAVING AVG(t.milliseconds) > (SELECT AVG(milliseconds) FROM public.track) ORDER BY average_milliseconds DESC, g.genre_id;"
      expected_schema: {tables: ["public.genre", "public.track"]}
      expected_sql_contract: {required_features: [aggregation, subquery, join, group_by, having, order_by]}
      tags: [aggregation, subquery, comparison, join, multi_table, having, group_by, ordering]
      difficulty: medium
      metadata: {category: comparison, source: manual, query_language: zh, business_domain: catalog}
      result_comparison: {order_sensitive: false}

    - id: ch_zh_058
      database_id: chinook
      dialect: postgres
      query: "按专辑编号累计统计目录曲目数，返回专辑编号、名称、曲目数和累计曲目数。"
      ground_truth_sql: "WITH counts AS (SELECT al.album_id, al.title, COUNT(t.track_id) AS track_count FROM public.album al LEFT JOIN public.track t ON t.album_id = al.album_id GROUP BY al.album_id, al.title) SELECT album_id, title AS album_title, track_count, SUM(track_count) OVER (ORDER BY album_id) AS cumulative_track_count FROM counts ORDER BY album_id;"
      expected_schema: {tables: ["public.album", "public.track"]}
      expected_sql_contract: {required_features: [aggregation, cte, window, join, group_by, order_by]}
      tags: [aggregation, cte, window, join, multi_table, null_handling, group_by, ordering]
      difficulty: hard
      metadata: {category: window, source: manual, query_language: zh, business_domain: catalog}
      result_comparison: {order_sensitive: false}

    - id: ch_zh_059
      database_id: chinook
      dialect: postgres
      query: "列出出现在播放列表中但从未售出的曲目编号和名称。"
      ground_truth_sql: "SELECT t.track_id, t.name AS track_name FROM public.track t WHERE t.track_id IN (SELECT track_id FROM public.playlist_track) EXCEPT SELECT t.track_id, t.name AS track_name FROM public.track t JOIN public.invoice_line il ON il.track_id = t.track_id ORDER BY track_id;"
      expected_schema: {tables: ["public.track", "public.playlist_track", "public.invoice_line"]}
      expected_sql_contract: {required_features: [subquery, join, order_by]}
      tags: [subquery, set_operation, join, multi_table, ordering]
      difficulty: hard
      metadata: {category: subquery, source: manual, query_language: zh, business_domain: catalog}
      result_comparison: {order_sensitive: false}

    - id: ch_zh_060
      database_id: chinook
      dialect: postgres
      query: "按曲目单价分层统计曲目数：低于 1 美元、1 到 1.99 美元、2 美元及以上。"
      ground_truth_sql: "SELECT CASE WHEN unit_price < 1 THEN 'under_1' WHEN unit_price < 2 THEN '1_to_1_99' ELSE '2_plus' END AS price_tier, COUNT(*) AS track_count FROM public.track GROUP BY CASE WHEN unit_price < 1 THEN 'under_1' WHEN unit_price < 2 THEN '1_to_1_99' ELSE '2_plus' END ORDER BY price_tier;"
      expected_schema: {tables: ["public.track"]}
      expected_sql_contract: {required_features: [aggregation, case_when, group_by, order_by]}
      tags: [aggregation, case_when, group_by, ordering]
      difficulty: easy
      metadata: {category: aggregation, source: manual, query_language: zh, business_domain: catalog}
      result_comparison:
        order_sensitive: false
        value_aliases:
          under_1: ["低于1美元", "低于 1 美元"]
          1_to_1_99: ["1到1.99美元", "1 到 1.99 美元"]
          2_plus: ["2美元及以上", "2 美元及以上"]

    - id: ch_zh_061
      database_id: chinook
      dialect: postgres
      query: "每个播放列表包含多少首不同曲目，其中多少首有过销售，并计算这些曲目的销售收入。返回播放列表编号、名称、目录曲目数、售出曲目数和销售收入。"
      ground_truth_sql: "SELECT p.playlist_id, p.name AS playlist_name, COUNT(DISTINCT pt.track_id) AS catalog_track_count, COUNT(DISTINCT il.track_id) AS sold_track_count, COALESCE(SUM(il.unit_price * il.quantity), 0) AS sales_revenue FROM public.playlist p LEFT JOIN public.playlist_track pt ON pt.playlist_id = p.playlist_id LEFT JOIN public.invoice_line il ON il.track_id = pt.track_id GROUP BY p.playlist_id, p.name ORDER BY p.playlist_id;"
      expected_schema: {tables: ["public.playlist", "public.playlist_track", "public.invoice_line"]}
      expected_sql_contract: {required_features: [aggregation, distinct, join, group_by, order_by]}
      tags: [aggregation, distinct, join, multi_table, null_handling, group_by, ordering]
      difficulty: hard
      metadata: {category: join, source: manual, query_language: zh, business_domain: catalog}
      result_comparison: {order_sensitive: false}

    - id: ch_zh_062
      database_id: chinook
      dialect: postgres
      query: "统计 2023 和 2024 年每年各媒体类型的销售收入，返回年份、媒体类型编号、媒体类型名称和销售收入，按年份、媒体类型编号排列。"
      ground_truth_sql: "SELECT EXTRACT(YEAR FROM i.invoice_date)::int AS sales_year, mt.media_type_id, mt.name AS media_type_name, SUM(il.unit_price * il.quantity) AS sales_revenue FROM public.invoice i JOIN public.invoice_line il ON il.invoice_id = i.invoice_id JOIN public.track t ON t.track_id = il.track_id JOIN public.media_type mt ON mt.media_type_id = t.media_type_id WHERE i.invoice_date >= DATE '2023-01-01' AND i.invoice_date < DATE '2025-01-01' GROUP BY EXTRACT(YEAR FROM i.invoice_date), mt.media_type_id, mt.name ORDER BY sales_year, mt.media_type_id;"
      expected_schema: {tables: ["public.invoice", "public.invoice_line", "public.track", "public.media_type"]}
      expected_sql_contract: {required_features: [aggregation, join, where, group_by, order_by]}
      tags: [aggregation, time_series, date_filter, join, multi_table, group_by, ordering]
      difficulty: medium
      metadata: {category: time_series, source: manual, query_language: zh, business_domain: catalog}

    - id: ch_zh_063
      database_id: chinook
      dialect: postgres
      query: "计算各流派销售收入及其占全部收入的比例，并按占比从高到低排列。"
      ground_truth_sql: "WITH genre_sales AS (SELECT g.genre_id, g.name AS genre_name, SUM(il.unit_price * il.quantity) AS sales_revenue FROM public.genre g JOIN public.track t ON t.genre_id = g.genre_id JOIN public.invoice_line il ON il.track_id = t.track_id GROUP BY g.genre_id, g.name) SELECT genre_id, genre_name, sales_revenue, sales_revenue / NULLIF(SUM(sales_revenue) OVER (), 0) AS revenue_share FROM genre_sales ORDER BY revenue_share DESC, genre_id;"
      expected_schema: {tables: ["public.genre", "public.track", "public.invoice_line"]}
      expected_sql_contract: {required_features: [aggregation, cte, window, join, group_by, order_by]}
      tags: [aggregation, cte, window, case_when, join, multi_table, null_handling, group_by, ordering]
      difficulty: hard
      metadata: {category: window, source: manual, query_language: zh, business_domain: catalog}

    - id: ch_zh_064
      database_id: chinook
      dialect: postgres
      query: "列出既有专辑又至少有一首曲目售出的艺术家编号和名称。"
      ground_truth_sql: "SELECT ar.artist_id, ar.name AS artist_name FROM public.artist ar WHERE EXISTS (SELECT 1 FROM public.album al WHERE al.artist_id = ar.artist_id) INTERSECT SELECT ar.artist_id, ar.name AS artist_name FROM public.artist ar JOIN public.album al ON al.artist_id = ar.artist_id JOIN public.track t ON t.album_id = al.album_id JOIN public.invoice_line il ON il.track_id = t.track_id ORDER BY artist_id;"
      expected_schema: {tables: ["public.artist", "public.album", "public.track", "public.invoice_line"]}
      expected_sql_contract: {required_features: [subquery, join, order_by]}
      tags: [subquery, set_operation, join, multi_table, distinct, ordering]
      difficulty: hard
      metadata: {category: subquery, source: manual, query_language: zh, business_domain: catalog}
      result_comparison: {order_sensitive: false}

    - id: ch_zh_065
      database_id: chinook
      dialect: postgres
      query: "各账单国家或地区的订单数、平均客单价和销售总额是多少？"
      ground_truth_sql: "SELECT billing_country, COUNT(*) AS invoice_count, AVG(total) AS average_invoice_value, SUM(total) AS sales_total FROM public.invoice GROUP BY billing_country ORDER BY sales_total DESC, billing_country;"
      expected_schema: {tables: ["public.invoice"]}
      expected_sql_contract: {required_features: [aggregation, group_by, order_by]}
      tags: [aggregation, group_by, ordering]
      difficulty: easy
      metadata: {category: aggregation, source: manual, query_language: zh, business_domain: sales}
      result_comparison: {order_sensitive: false}

    - id: ch_zh_066
      database_id: chinook
      dialect: postgres
      query: "列出 2024 年金额高于当年平均订单金额的订单，返回订单编号、日期和金额。"
      ground_truth_sql: "SELECT invoice_id, invoice_date, total FROM public.invoice WHERE invoice_date >= DATE '2024-01-01' AND invoice_date < DATE '2025-01-01' AND total > (SELECT AVG(total) FROM public.invoice WHERE invoice_date >= DATE '2024-01-01' AND invoice_date < DATE '2025-01-01') ORDER BY total DESC, invoice_id;"
      expected_schema: {tables: ["public.invoice"]}
      expected_sql_contract: {required_features: [aggregation, subquery, where, order_by]}
      tags: [aggregation, subquery, comparison, date_filter, ordering]
      difficulty: medium
      metadata: {category: subquery, source: manual, query_language: zh, business_domain: sales}
      result_comparison: {order_sensitive: false}

    - id: ch_zh_067
      database_id: chinook
      dialect: postgres
      query: "统计 2023 和 2024 年每个季度的订单数和销售总额。"
      ground_truth_sql: "SELECT DATE_TRUNC('quarter', invoice_date)::date AS sales_quarter, COUNT(*) AS invoice_count, SUM(total) AS sales_total FROM public.invoice WHERE invoice_date >= DATE '2023-01-01' AND invoice_date < DATE '2025-01-01' GROUP BY DATE_TRUNC('quarter', invoice_date) ORDER BY sales_quarter;"
      expected_schema: {tables: ["public.invoice"]}
      result_comparison: {numeric_decimal_places: 2, temporal_granularity: date, order_sensitive: false}
      expected_sql_contract: {required_features: [aggregation, where, group_by, order_by]}
      tags: [aggregation, time_series, date_filter, group_by, ordering]
      difficulty: medium
      metadata: {category: time_series, source: manual, query_language: zh, business_domain: sales}

    - id: ch_zh_068
      database_id: chinook
      dialect: postgres
      query: "至少有 5 笔订单的账单城市中，订单数最多的 10 个是哪些？返回城市、订单数和销售总额。"
      ground_truth_sql: "SELECT billing_city, COUNT(*) AS invoice_count, SUM(total) AS sales_total FROM public.invoice GROUP BY billing_city HAVING COUNT(*) >= 5 ORDER BY invoice_count DESC, billing_city LIMIT 10;"
      expected_schema: {tables: ["public.invoice"]}
      expected_sql_contract: {required_features: [aggregation, group_by, having, order_by, limit]}
      tags: [aggregation, topk, having, group_by, ordering]
      difficulty: easy
      metadata: {category: topk, source: manual, query_language: zh, business_domain: sales}
      result_comparison: {order_sensitive: false}

    - id: ch_zh_069
      database_id: chinook
      dialect: postgres
      query: "按月统计销售额，并计算截至每个月的累计销售额。"
      ground_truth_sql: "WITH monthly AS (SELECT DATE_TRUNC('month', invoice_date)::date AS sales_month, SUM(total) AS sales_total FROM public.invoice GROUP BY DATE_TRUNC('month', invoice_date)) SELECT sales_month, sales_total, SUM(sales_total) OVER (ORDER BY sales_month) AS cumulative_sales FROM monthly ORDER BY sales_month;"
      expected_schema: {tables: ["public.invoice"]}
      result_comparison: {numeric_decimal_places: 2, temporal_granularity: date, order_sensitive: false}
      expected_sql_contract: {required_features: [aggregation, cte, window, group_by, order_by]}
      tags: [aggregation, time_series, window, cte, group_by, ordering]
      difficulty: hard
      metadata: {category: window, source: manual, query_language: zh, business_domain: sales}

    - id: ch_zh_070
      database_id: chinook
      dialect: postgres
      query: "哪些客户的平均订单金额高于全部订单的平均金额？返回客户编号、合并后的客户姓名和平均订单金额。"
      ground_truth_sql: "SELECT c.customer_id, c.first_name || ' ' || c.last_name AS customer_name, AVG(i.total) AS average_invoice_value FROM public.customer c JOIN public.invoice i ON i.customer_id = c.customer_id GROUP BY c.customer_id, c.first_name, c.last_name HAVING AVG(i.total) > (SELECT AVG(total) FROM public.invoice) ORDER BY average_invoice_value DESC, c.customer_id;"
      expected_schema: {tables: ["public.customer", "public.invoice"]}
      expected_sql_contract: {required_features: [aggregation, subquery, join, group_by, having, order_by]}
      tags: [aggregation, subquery, comparison, join, multi_table, having, group_by, ordering]
      difficulty: hard
      metadata: {category: subquery, source: manual, query_language: zh, business_domain: sales}
      result_comparison: {order_sensitive: false}

    - id: ch_zh_071
      database_id: chinook
      dialect: postgres
      query: "比较各账单国家或地区 2023 年和 2024 年的销售额，并计算变化额。"
      ground_truth_sql: "SELECT billing_country, SUM(CASE WHEN invoice_date >= DATE '2023-01-01' AND invoice_date < DATE '2024-01-01' THEN total ELSE 0 END) AS sales_2023, SUM(CASE WHEN invoice_date >= DATE '2024-01-01' AND invoice_date < DATE '2025-01-01' THEN total ELSE 0 END) AS sales_2024, SUM(CASE WHEN invoice_date >= DATE '2024-01-01' AND invoice_date < DATE '2025-01-01' THEN total ELSE 0 END) - SUM(CASE WHEN invoice_date >= DATE '2023-01-01' AND invoice_date < DATE '2024-01-01' THEN total ELSE 0 END) AS sales_change FROM public.invoice WHERE invoice_date >= DATE '2023-01-01' AND invoice_date < DATE '2025-01-01' GROUP BY billing_country ORDER BY sales_change DESC, billing_country;"
      expected_schema: {tables: ["public.invoice"]}
      expected_sql_contract: {required_features: [aggregation, case_when, where, group_by, order_by]}
      tags: [aggregation, comparison, case_when, date_filter, group_by, ordering]
      difficulty: medium
      metadata: {category: comparison, source: manual, query_language: zh, business_domain: sales}
      result_comparison: {order_sensitive: false, compare_column_names: false}

    - id: ch_zh_072
      database_id: chinook
      dialect: postgres
      query: "每个账单国家或地区金额最高的一笔订单是什么？返回国家或地区、订单编号、金额和排名。"
      ground_truth_sql: "WITH ranked AS (SELECT billing_country, invoice_id, total, ROW_NUMBER() OVER (PARTITION BY billing_country ORDER BY total DESC, invoice_id) AS country_rank FROM public.invoice) SELECT billing_country, invoice_id, total, country_rank FROM ranked WHERE country_rank = 1 ORDER BY billing_country;"
      expected_schema: {tables: ["public.invoice"]}
      expected_sql_contract: {required_features: [cte, window, where, order_by]}
      tags: [window, ranking, topk, cte, ordering]
      difficulty: hard
      metadata: {category: window, source: manual, query_language: zh, business_domain: sales}

    - id: ch_zh_073
      database_id: chinook
      dialect: postgres
      query: "按订单金额分为低于 5、5 到 9.99、10 及以上三档，统计订单数和销售总额。"
      ground_truth_sql: "SELECT CASE WHEN total < 5 THEN 'under_5' WHEN total < 10 THEN '5_to_9_99' ELSE '10_plus' END AS value_tier, COUNT(*) AS invoice_count, SUM(total) AS sales_total FROM public.invoice GROUP BY CASE WHEN total < 5 THEN 'under_5' WHEN total < 10 THEN '5_to_9_99' ELSE '10_plus' END ORDER BY value_tier;"
      expected_schema: {tables: ["public.invoice"]}
      expected_sql_contract: {required_features: [aggregation, case_when, group_by, order_by]}
      tags: [aggregation, case_when, group_by, ordering]
      difficulty: easy
      metadata: {category: aggregation, source: manual, query_language: zh, business_domain: sales}
      result_comparison:
        order_sensitive: false
        value_aliases:
          under_5: ["低于5", "低于 5"]
          5_to_9_99: ["5到9.99", "5 到 9.99"]
          10_plus: ["10及以上", "10 及以上"]

    - id: ch_zh_074
      database_id: chinook
      dialect: postgres
      query: "按账单国家或地区和媒体类型统计销售收入，返回国家或地区、媒体类型编号、媒体类型名称和收入，按国家或地区、收入降序、媒体类型编号排列。"
      ground_truth_sql: "SELECT i.billing_country, mt.media_type_id, mt.name AS media_type_name, SUM(il.unit_price * il.quantity) AS sales_revenue FROM public.invoice i JOIN public.invoice_line il ON il.invoice_id = i.invoice_id JOIN public.track t ON t.track_id = il.track_id JOIN public.media_type mt ON mt.media_type_id = t.media_type_id GROUP BY i.billing_country, mt.media_type_id, mt.name ORDER BY i.billing_country, sales_revenue DESC, mt.media_type_id;"
      expected_schema: {tables: ["public.invoice", "public.invoice_line", "public.track", "public.media_type"]}
      expected_sql_contract: {required_features: [aggregation, join, group_by, order_by]}
      tags: [aggregation, join, multi_table, group_by, ordering]
      difficulty: hard
      metadata: {category: join, source: manual, query_language: zh, business_domain: sales}

    - id: ch_zh_075
      database_id: chinook
      dialect: postgres
