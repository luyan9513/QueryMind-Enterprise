      ground_truth_sql: "SELECT c.customer_id, c.first_name || ' ' || c.last_name AS customer_name, SUM(CASE WHEN i.invoice_date >= DATE '2023-01-01' AND i.invoice_date < DATE '2024-01-01' THEN i.total ELSE 0 END) AS sales_2023, SUM(CASE WHEN i.invoice_date >= DATE '2024-01-01' AND i.invoice_date < DATE '2025-01-01' THEN i.total ELSE 0 END) AS sales_2024, SUM(CASE WHEN i.invoice_date >= DATE '2024-01-01' AND i.invoice_date < DATE '2025-01-01' THEN i.total ELSE 0 END) - SUM(CASE WHEN i.invoice_date >= DATE '2023-01-01' AND i.invoice_date < DATE '2024-01-01' THEN i.total ELSE 0 END) AS sales_change FROM public.customer c JOIN public.invoice i ON i.customer_id = c.customer_id WHERE i.invoice_date >= DATE '2023-01-01' AND i.invoice_date < DATE '2025-01-01' GROUP BY c.customer_id, c.first_name, c.last_name ORDER BY c.customer_id;"
